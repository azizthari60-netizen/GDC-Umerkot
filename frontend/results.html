<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admission Test Result - GBDC Umerkot</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .result-container { max-width: 500px; margin: 40px auto; padding: 20px; font-family: sans-serif; }
    .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
    .search-box input { flex: 1; padding: 10px; font-size: 16px; }
    .search-box button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
    .result-display { display: none; background: #f4f4f4; padding: 20px; border-radius: 8px; border: 1px solid #ccc; }
    .result-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #ddd; }
    .error-msg { color: red; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>

<div class="result-container">
  <h2>Admission Test Result</h2>
  <p>رول نمبر یا شناختی کارڈ نمبر درج کریں:</p>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Enter Roll No or CNIC..." />
    <button id="searchBtn" onclick="searchResult()">Check Result</button>
  </div>

  <div id="statusMsg" class="error-msg"></div>

  <!-- Result Box -->
  <div id="resultBox" class="result-display">
    <div class="result-row"><strong>Roll No:</strong> <span id="resRoll">-</span></div>
    <div class="result-row"><strong>Name:</strong> <span id="resName">-</span></div>
    <div class="result-row"><strong>Father Name:</strong> <span id="resFather">-</span></div>
    <div class="result-row"><strong>Obtained Marks:</strong> <span id="resMarks">-</span></div>
    <div class="result-row"><strong>Assigned Class:</strong> <span id="resClass" style="color: green; font-weight: bold;">-</span></div>
  </div>
</div>

<script>
async function searchResult() {
  const query = document.getElementById("searchInput").value.trim();
  const statusMsg = document.getElementById("statusMsg");
  const resultBox = document.getElementById("resultBox");
  const searchBtn = document.getElementById("searchBtn");

  statusMsg.innerText = "";
  resultBox.style.display = "none";

  if (!query) {
    statusMsg.innerText = "براہ کرم رول نمبر یا CNIC لکھیں۔";
    return;
  }

  searchBtn.disabled = true;
  searchBtn.innerText = "Searching...";

  try {
    const res = await fetch('/api/result/' + encodeURIComponent(query));
    const result = await res.json();

    if (!res.ok || !result.success) {
      throw new Error(result.message || "رزلٹ نہیں ملا۔");
    }

    const data = result.data;
    const marks = data.obtainedMarks ?? data.ObtainedMarks ?? 0;
    const applyFor = data.applyFor || data.ApplyFor || "";

    // Class Logic
    let assignedClass = "N/A";
    const group = String(applyFor).toLowerCase();
    if (group.includes("p.e") || group.includes("pe")) assignedClass = "XI E";
    else if (group.includes("c.s") || group.includes("cs")) assignedClass = "XI F";
    else if (group.includes("p.m") || group.includes("pm")) {
      const m = Number(marks);
      if (m >= 48) assignedClass = "Class A";
      else if (m >= 33) assignedClass = "Class B";
      else if (m >= 20) assignedClass = "Class C";
      else assignedClass = "Class D";
    }

    document.getElementById("resRoll").innerText = data.rollNo || data.RollNo || query;
    document.getElementById("resName").innerText = data.name || data.Name || "-";
    document.getElementById("resFather").innerText = data.fatherName || data.FatherName || "-";
    document.getElementById("resMarks").innerText = marks;
    document.getElementById("resClass").innerText = assignedClass;

    resultBox.style.display = "block";

  } catch (err) {
    statusMsg.innerText = err.message;
  } finally {
    searchBtn.disabled = false;
    searchBtn.innerText = "Check Result";
  }
}
</script>

</body>
</html>
